# Self-hosted n8n for LendLoop's automations.
# Secrets come from .env.n8n (git-ignored); copy .env.n8n.example to start.
services:
  n8n:
    image: n8nio/n8n:2.48.8
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env.n8n
    environment:
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - N8N_SECURE_COOKIE=false # local http only; remove behind HTTPS
      # Code nodes need Node's crypto module for HMAC and read config via $env.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
